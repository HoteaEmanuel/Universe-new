<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="orbitGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
<stop offset="0%" stop-color="#2c3e50"/>
<stop offset="100%" stop-color="#4ca1af"/>
</linearGradient>
<linearGradient id="capGrad" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
